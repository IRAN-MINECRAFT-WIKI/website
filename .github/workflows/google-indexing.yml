name: Google Indexing

on:
  schedule:
    - cron: '0 0 * * *' # هر روز نیمه‌شب
  workflow_dispatch: # اجرای دستی

permissions:
  contents: write # دسترسی لازم برای کامیت کردن فایل وضعیت

jobs:
  google-indexing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install googleapis xml2js axios

      - name: Run Indexing Script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          cat << 'EOF' > index.js
          const { google } = require('googleapis');
          const axios = require('axios');
          const xml2js = require('xml2js');
          const fs = require('fs');
          const path = require('path');

          // مسیر فایل حافظه (وضعیت)
          const STATE_FILE = path.join(process.cwd(), 'indexed-urls.json');

          // تابع خواندن فایل وضعیت
          function loadState() {
            if (fs.existsSync(STATE_FILE)) {
              try {
                return JSON.parse(fs.readFileSync(STATE_FILE, 'utf-8'));
              } catch (e) {
                console.warn('⚠️ فایل وضعیت خراب است، از نو ساخته می‌شود.');
                return { submitted: [] };
              }
            }
            return { submitted: [] };
          }

          // تابع ذخیره فایل وضعیت
          function saveState(state) {
            fs.writeFileSync(STATE_FILE, JSON.stringify(state, null, 2));
            console.log(`💾 وضعیت ذخیره شد. ${state.submitted.length} لینک تاکنون ارسال شده است.`);
          }

          // تابع تصادفی کردن آرایه
          function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
          }

          async function main() {
            if (!process.env.GCP_SA_KEY) {
              console.error("❌ خطا: متغیر GCP_SA_KEY خالی است.");
              process.exit(1);
            }

            let key;
            try {
              key = JSON.parse(process.env.GCP_SA_KEY);
            } catch (e) {
              console.error("❌ خطا: محتوای GCP_SA_KEY یک JSON معتبر نیست.");
              process.exit(1);
            }

            const auth = google.auth.fromJSON(key);
            auth.scopes = ['https://www.googleapis.com/auth/indexing'];
            const siteUrl = 'https://iran-minecraft-wiki.github.io/website/';

            try {
              await auth.authorize();
              console.log("✅ احراز هویت انجام شد. در حال خواندن Sitemap...");

              // خواندن تمام لینک‌های موجود در Sitemap
              const indexRes = await axios.get(`${siteUrl}sitemap-index.xml`);
              const indexParsed = await xml2js.parseStringPromise(indexRes.data);
              const sitemaps = indexParsed.sitemapindex.sitemap.map(s => s.loc[0]);

              let allUrls = [];
              for (const sitemap of sitemaps) {
                const res = await axios.get(sitemap);
                const parsed = await xml2js.parseStringPromise(res.data);
                if (parsed.urlset && parsed.urlset.url) {
                  parsed.urlset.url.forEach(u => allUrls.push(u.loc[0]));
                }
              }

              console.log(`🌍 در مجموع ${allUrls.length} لینک در سایت پیدا شد.`);

              // بارگذاری وضعیت قبلی
              const state = loadState();
              const submittedSet = new Set(state.submitted);

              // فیلتر کردن لینک‌هایی که هنوز ارسال نشده‌اند
              let newUrls = allUrls.filter(url => !submittedSet.has(url));

              console.log(`🆕 ${newUrls.length} لینک جدید (ارسال نشده) پیدا شد.`);

              if (newUrls.length === 0) {
                console.log("🎉 همه لینک‌ها قبلاً ارسال شده‌اند. کاری برای انجام نیست.");
                return;
              }

              // بهم ریختن لینک‌های جدید و انتخاب فقط ۲۰۰ لینک اول (سهمیه روزانه)
              const shuffledNewUrls = shuffle(newUrls);
              const urlsToSubmit = shuffledNewUrls.slice(0, 200);

              console.log(`🚀 در حال ارسال ${urlsToSubmit.length} لینک جدید به گوگل...`);

              let successCount = 0;
              for (const url of urlsToSubmit) {
                try {
                  await google.indexing('v3').urlNotifications.publish({
                    auth: auth,
                    requestBody: {
                      url: url,
                      type: 'URL_UPDATED',
                    },
                  });
                  console.log(`✅ Success: ${url}`);
                  successCount++;
                  // اضافه کردن به لیست ارسال‌شده‌ها
                  state.submitted.push(url);
                } catch (err) {
                  if (err.message.includes('Quota exceeded')) {
                    console.log(`⚠️ سهمیه پر شد: ${url}`);
                  } else {
                    console.error(`❌ Error for ${url}:`, err.message);
                  }
                }
              }

              // ذخیره وضعیت نهایی
              saveState(state);
              console.log(`🎉 عملیات امروز تمام شد. ${successCount} لینک جدید با موفقیت ارسال شد.`);

            } catch (error) {
              console.error("❌ خطای کلی:", error.message);
              process.exit(1);
            }
          }
          main();
          EOF
          node index.js

      - name: Commit and Push State File
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update indexed URLs state [skip ci]"
          file_pattern: indexed-urls.json
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
