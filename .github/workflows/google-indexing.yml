name: Google Indexing

on:
  schedule:
    - cron: '0 0 * * *' # هر روز نیمه‌شب
  workflow_dispatch: # اجرای دستی

jobs:
  google-indexing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install googleapis xml2js axios

      - name: Run Indexing Script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          cat << 'EOF' > index.js
          const { google } = require('googleapis');
          const axios = require('axios');
          const xml2js = require('xml2js');

          async function main() {
            if (!process.env.GCP_SA_KEY) {
              console.error("❌ خطا: متغیر GCP_SA_KEY خالی است. لطفا سکرت را در تنظیمات گیت‌هاب چک کنید.");
              process.exit(1);
            }

            let key;
            try {
              key = JSON.parse(process.env.GCP_SA_KEY);
            } catch (e) {
              console.error("❌ خطا: محتوای GCP_SA_KEY یک JSON معتبر نیست. لطفا کل فایل JSON را کپی کنید.");
              process.exit(1);
            }

            if (!key.private_key || !key.client_email) {
              console.error("❌ خطا: فیلدهای client_email یا private_key در سکرت شما وجود ندارند. آیا فایل را کامل کپی کرده‌اید؟");
              process.exit(1);
            }

            console.log("✅ کلیدهای احراز هویت با موفقیت خوانده شدند.");
            console.log("📧 ایمیل ربات:", key.client_email);

            // استفاده از روش استاندارد گوگل برای خواندن کلید
            const auth = google.auth.fromJSON(key);
            auth.scopes = ['https://www.googleapis.com/auth/indexing'];

            const siteUrl = 'https://iran-minecraft-wiki.github.io/website/';

            try {
              await auth.authorize();
              console.log("✅ احراز هویت با گوگل با موفقیت انجام شد.");

              console.log(`Fetching sitemap from: ${siteUrl}sitemap-index.xml`);
              const indexRes = await axios.get(`${siteUrl}sitemap-index.xml`);
              const indexParsed = await xml2js.parseStringPromise(indexRes.data);
              const sitemaps = indexParsed.sitemapindex.sitemap.map(s => s.loc[0]);

              const urls = [];
              for (const sitemap of sitemaps) {
                console.log(`Fetching inner sitemap: ${sitemap}`);
                const res = await axios.get(sitemap);
                const parsed = await xml2js.parseStringPromise(res.data);
                if (parsed.urlset && parsed.urlset.url) {
                  parsed.urlset.url.forEach(u => urls.push(u.loc[0]));
                }
              }

              console.log(`Found ${urls.length} URLs to index.`);

              for (const url of urls) {
                try {
                  await google.indexing('v3').urlNotifications.publish({
                    auth: auth,
                    requestBody: {
                      url: url,
                      type: 'URL_UPDATED',
                    },
                  });
                  console.log(`✅ Success: ${url}`);
                } catch (err) {
                  console.error(`❌ Error for ${url}:`, err.message);
                }
              }
            } catch (error) {
              console.error("❌ خطای کلی در ارتباط با گوگل:", error.message);
              process.exit(1);
            }
          }
          main();
          EOF
          node index.js
