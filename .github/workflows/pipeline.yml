name: Daily Auto-Fetch Mods

on:
  schedule:
    # 02:00 UTC every day (~05:30 Iran Standard Time)
    - cron: '0 2 * * *'
  workflow_dispatch:

# Allow the workflow to push back to the repo
permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            requests \
            openai \
            python-dotenv \
            huggingface_hub \
            fastapi \
            uvicorn

      - name: Run daily pipeline (crawl + AI + HuggingFace + GitHub push)
        env:
          # Secret tokens (do not echo)
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_BASE_URL: ${{ secrets.AGNES_BASE_URL }}
          AGNES_MODEL: ${{ secrets.AGNES_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }} # use a PAT, NOT the auto GITHUB_TOKEN
          GITHUB_USER: IRAN-MINECRAFT-WIKI
          GITHUB_REPO: website
          GITHUB_BRANCH: main
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
          ASTRO_DATA_PATH: website/src/data
          MODS_JSON_PATH: website/src/data/mods.json
        run: |
          PYTHONPATH=admin python website/pipeline/run.py --auto 5

      # NOTE: the pipeline pushes mods.json to GitHub directly via the
      # Contents API (see push_mods_to_github in pipeline/run.py), so
      # no separate git commit / push step is needed.  This works
      # around the GITHUB_TOKEN auto-token's restrictions on pushing
      # to the default branch by requiring GH_PAT (a real PAT) instead.
