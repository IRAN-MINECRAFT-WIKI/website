<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bgGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c34"/>
      <stop offset="100%" stop-color="#0d0d18"/>
    </linearGradient>
    <linearGradient id="topBarB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fcb32b"/>
      <stop offset="100%" stop-color="#d49520"/>
    </linearGradient>
    <pattern id="dotsB" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.5" fill="#fcb32b" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGradB)"/>
  <rect width="100%" height="100%" fill="url(#dotsB)"/>
  <rect x="0" y="0" width="640" height="8" fill="url(#topBarB)"/>
  <!-- Book icon (Minecraft-style) -->
  <g transform="translate(280, 130)">
    <rect x="0" y="0" width="80" height="80" fill="#7cc84a" stroke="#2b1d0e" stroke-width="3"/>
    <rect x="5" y="5" width="70" height="70" fill="#9ed968" stroke="#2b1d0e" stroke-width="2"/>
    <line x1="40" y1="5" x2="40" y2="75" stroke="#2b1d0e" stroke-width="2"/>
    <line x1="15" y1="25" x2="35" y2="25" stroke="#2b1d0e" stroke-width="2"/>
    <line x1="15" y1="35" x2="35" y2="35" stroke="#2b1d0e" stroke-width="2"/>
    <line x1="15" y1="45" x2="35" y2="45" stroke="#2b1d0e" stroke-width="2"/>
    <line x1="45" y1="25" x2="65" y2="25" stroke="#2b1d0e" stroke-width="2"/>
    <line x1="45" y1="35" x2="65" y2="35" stroke="#2b1d0e" stroke-width="2"/>
    <line x1="45" y1="45" x2="65" y2="45" stroke="#2b1d0e" stroke-width="2"/>
  </g>
  <text x="320" y="245" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="22" font-weight="bold" fill="#e0e0f0" direction="rtl">مقاله‌ی ماین‌بد</text>
  <text x="320" y="275" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="13" fill="#9a9ab8" direction="rtl">تصویر به‌زودی اضافه می‌شه</text>
  <text x="320" y="330" text-anchor="middle" font-family="monospace" font-size="11" fill="#fcb32b" letter-spacing="2">MINEBED FARSI</text>
</svg>
