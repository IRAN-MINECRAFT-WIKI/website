<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bgGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c34"/>
      <stop offset="100%" stop-color="#0d0d18"/>
    </linearGradient>
    <linearGradient id="topBarM" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9c7b4e"/>
      <stop offset="100%" stop-color="#7a5e3a"/>
    </linearGradient>
    <pattern id="dotsM" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.5" fill="#9c7b4e" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGradM)"/>
  <rect width="100%" height="100%" fill="url(#dotsM)"/>
  <rect x="0" y="0" width="640" height="8" fill="url(#topBarM)"/>
  <!-- Chest icon (Minecraft-style) -->
  <g transform="translate(280, 130)">
    <rect x="0" y="0" width="80" height="40" fill="#9c7b4e" stroke="#2b1d0e" stroke-width="3"/>
    <rect x="0" y="40" width="80" height="40" fill="#7a5e3a" stroke="#2b1d0e" stroke-width="3"/>
    <rect x="35" y="35" width="10" height="10" fill="#3a2a18" stroke="#2b1d0e" stroke-width="2"/>
  </g>
  <text x="320" y="245" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="22" font-weight="bold" fill="#e0e0f0" direction="rtl">افزونه‌ی ماین‌بد</text>
  <text x="320" y="275" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="13" fill="#9a9ab8" direction="rtl">تصویر به‌زودی اضافه می‌شه</text>
  <text x="320" y="330" text-anchor="middle" font-family="monospace" font-size="11" fill="#5fa838" letter-spacing="2">MINEBED FARSI</text>
</svg>
