<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c34"/>
      <stop offset="100%" stop-color="#0d0d18"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d7521"/>
      <stop offset="100%" stop-color="#5fa838"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.5" fill="#7cc84a" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#dots)"/>
  <rect x="0" y="0" width="640" height="8" fill="url(#topBar)"/>
  <!-- Minecraft-style cube icon -->
  <g transform="translate(280, 130)">
    <rect x="0" y="0" width="80" height="80" fill="#5fa838" stroke="#2b1d0e" stroke-width="3"/>
    <rect x="0" y="0" width="80" height="20" fill="#7cc84a" stroke="#2b1d0e" stroke-width="3"/>
    <line x1="20" y1="0" x2="20" y2="20" stroke="#2b1d0e" stroke-width="2"/>
    <line x1="40" y1="0" x2="40" y2="20" stroke="#2b1d0e" stroke-width="2"/>
    <line x1="60" y1="0" x2="60" y2="20" stroke="#2b1d0e" stroke-width="2"/>
  </g>
  <text x="320" y="245" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="22" font-weight="bold" fill="#e0e0f0" direction="rtl">آموزش ماین‌بد</text>
  <text x="320" y="275" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="13" fill="#9a9ab8" direction="rtl">تصویر به‌زودی اضافه می‌شه</text>
  <text x="320" y="330" text-anchor="middle" font-family="monospace" font-size="11" fill="#5fa838" letter-spacing="2">MINEBED FARSI</text>
</svg>
